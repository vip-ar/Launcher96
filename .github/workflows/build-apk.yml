
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle 8.7
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Build Launcher96
    run: gradle --no-daemon -p launcher96 :app:assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Launcher96-APK
      path: launcher96/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
